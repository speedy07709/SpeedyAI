<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeedyAI</title>
<style>
:root{--bg:#080a0f;--panel:#11151e;--line:#252c38;--text:#f5f7fb;--muted:#929baa;--accent:#6ea8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#18243a 0,#080a0f 45%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;font-size:22px;font-weight:800}.logo{color:var(--accent)}
main{width:min(900px,92%);margin:0 auto;padding:70px 0 30px}
.hero{text-align:center}.hero h1{font-size:clamp(38px,7vw,64px);margin:0 0 12px}.hero p{color:var(--muted);font-size:17px;margin:0 0 38px}
.chat{background:rgba(17,21,30,.94);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px #0008;overflow:hidden}
#messages{min-height:300px;max-height:52vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.message{max-width:82%;padding:12px 15px;border-radius:15px;line-height:1.45;white-space:pre-wrap}.ai{align-self:flex-start;background:#202633}.user{align-self:flex-end;background:#2456a6}
.composer{padding:14px;border-top:1px solid var(--line);display:flex;gap:10px}.composer input{flex:1;background:#0b0e14;color:#fff;border:1px solid #303746;border-radius:14px;padding:15px;outline:none;font-size:15px}.composer input:focus{border-color:var(--accent)}
button{border:0;border-radius:14px;padding:0 20px;background:var(--accent);color:#07101f;font-weight:800;cursor:pointer}
footer{text-align:center;color:#626b7b;font-size:13px;padding:28px}
</style>
</head>
<body>
<header><span class="logo">⚡ SpeedyAI</span></header>
<main>
<section class="hero">
<h1>Was möchtest du wissen?</h1>
<p>Deine KI für Fragen, Technik, Lernen und vieles mehr.</p>
</section>
<section class="chat">
<div id="messages"><div class="message ai">Hallo! Ich bin SpeedyAI. 👋<br>Die echte KI-Anbindung kommt als nächster Schritt.</div></div>
<div class="composer">
<input id="input" placeholder="Frag SpeedyAI …" autocomplete="off">
<button id="send">Senden</button>
</div>
</section>
</main>
<footer>SpeedyAI · Prototyp</footer>
<script>
const input=document.getElementById('input'), messages=document.getElementById('messages');
function send(){const t=input.value.trim();if(!t)return;
const u=document.createElement('div');u.className='message user';u.textContent=t;messages.appendChild(u);
const a=document.createElement('div');a.className='message ai';a.textContent='Deine Anfrage ist angekommen. Die echte KI wird im nächsten Schritt angeschlossen.';messages.appendChild(a);
input.value='';input.focus();messages.scrollTop=messages.scrollHeight}
document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
